[package]
name = "ikigai-jsonld"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "JSON-LD operators for ikigai — urn:jsonld:expand / :compact / :flatten as resources, plus :prune (the trust-boundary egress filter), on the json-ld crate with a static (no-network) context loader. Standalone, lazy-loadable as a WASM module."
repository = "https://github.com/ikigai-rs/ikigai-jsonld"
homepage = "https://github.com/ikigai-rs/ikigai-jsonld"
keywords = ["ikigai", "roc", "json-ld", "rdf", "linked-data"]
categories = ["web-programming"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.2.0 is the streams release (ledger #2261); the old 0.1 pin meant <0.2.0
# under 0.x compatibility rules.
ikigai-core = "0.2.0"
json-ld = { version = "0.21", default-features = false }
contextual = "0.1.6"
futures = "0.3"
async-trait = "0.1"

# The `module` feature turns this library into a standalone lazy-loadable WASM module via
# `ikigai_module::wasm_module!` — a host can fetch `ikigai_jsonld.wasm` and resolve
# `urn:jsonld:*` against it, keeping the heavy json-ld tree out of the host's wasm. Optional
# + behind the feature, so a native/linked consumer never pulls wasm-bindgen et al.
[dependencies.ikigai-module]
# 0.5.0 is the latest release and depends on ikigai-core 0.2.0.
version = "0.5.0"
optional = true
[dependencies.wasm-bindgen]
# EXACT on purpose (ledger #1193, #1342), unlike every other pin here. The `module` feature
# is built with THIS crate as the root package and post-processed by a `wasm-bindgen` CLI:
# ikigai-web-demo's `.github/workflows/pages.yml` ("Build JSON-LD module WASM + JS bindings
# into dist/") checks this repo out at JSONLD_REV, builds it with no lock (`Cargo.lock` is
# gitignored here), and runs the wasm-bindgen-cli 0.2.108 it installs
# (`tool: wasm-bindgen-cli@0.2.108`) over `ikigai_jsonld.wasm`. The CLI refuses a wasm whose
# library carries a different bindgen SCHEMA_VERSION (0.2.108's is 0.2.107; 0.2.128 and
# 0.2.129 carry 0.2.128), and under a caret the fresh resolve takes the newest 0.2.x. So this
# pin is the only thing tying the two together; bump it in step with that CLI pin (and the
# other `=0.2.108` crates beside it: ikigai-shacl, ikigai-xslt, ikigai-web-demo), never alone.
# It costs native consumers nothing: the dependency is optional and only `module` enables
# it, so a crate linking ikigai-jsonld never resolves it (gonk locks 0.2.128 beside it).
version = "=0.2.108"
optional = true
[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true
[dependencies.js-sys]
version = "0.3"
optional = true
[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[features]
# cargo build --release --lib --features module --target wasm32-unknown-unknown
module = [
    "dep:ikigai-module",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:console_error_panic_hook",
]

[dev-dependencies]
futures = "0.3"
# 0.11 enables DATATYPES and FAILURES by default on core 0.2.0.
ikigai-conformance = "0.11.0"
